name: Enhanced Java Application Pipeline

on:
  push:
    branches: [ pipeline-optimization ]
  pull_request:
    branches: [ pipeline-optimization ]

jobs:
  build-with-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup directories and install dependencies
        run: |
          set -eo pipefail
          
          # Create metrics directories
          mkdir -p metrics/system
          mkdir -p metrics/performance
          
          # Install necessary packages
          sudo apt-get update
          sudo apt-get install -y \
            linux-tools-common \
            linux-tools-generic \
            python3-pip \
            python3-psutil

          # Install Python dependencies
          pip3 install pandas numpy

      - name: Create performance monitoring script
        run: |
          cat > performance_monitor.py << 'EOL'
          import subprocess
          import csv
          import os
          import sys
          import time
          from datetime import datetime

          def monitor_performance(command, output_file):
              # Ensure directory exists
              os.makedirs(os.path.dirname(output_file), exist_ok=True)
          
              # Prepare the CSV file
              with open(output_file, 'w', newline='') as csvfile:
                  writer = csv.writer(csvfile)
                  writer.writerow([
                      'Timestamp', 
                      'CPU_Usage', 
                      'Memory_Usage', 
                      'Description'
                  ])
          
              try:
                  # Execute the main command
                  start_time = datetime.now()
          
                  # Run the command with performance monitoring
                  process = subprocess.Popen(
                      f"top -b -n 1 & {command}", 
                      shell=True, 
                      stdout=subprocess.PIPE, 
                      stderr=subprocess.PIPE, 
                      text=True
                  )
          
                  # Wait for the process to complete
                  _, stderr = process.communicate()
          
                  end_time = datetime.now()
          
                  # Log performance metrics
                  with open(output_file, 'a', newline='') as csvfile:
                      writer = csv.writer(csvfile)
                      writer.writerow([
                          start_time.isoformat(),
                          f"CommandStart: {start_time}",
                          f"CommandEnd: {end_time}",
                          "Overall Timing"
                      ])
          
                  # Check for any errors
                  if process.returncode != 0:
                      print(f"Command failed with error: {stderr}", file=sys.stderr)
                      return process.returncode
          
                  return 0
          
              except Exception as e:
                  print(f"Error monitoring performance: {e}", file=sys.stderr)
                  return 1
          
          def main():
              if len(sys.argv) < 3:
                  print("Usage: python performance_monitor.py 'command' output_file.csv")
                  sys.exit(1)
          
              command = sys.argv[1]
              output_file = sys.argv[2]
          
              monitor_performance(command, output_file)
          
          if __name__ == '__main__':
              main()
          EOL
          
          chmod +x performance_monitor.py

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Collect initial system metrics
        run: |
          set -eo pipefail
          
          # Record start time
          date +%s%N > metrics/pipeline_start_time.txt
          
          # Collect initial metrics
          echo "=== Initial System Resources ===" > metrics/system/initial_metrics.txt
          top -b -n 1 >> metrics/system/initial_metrics.txt
          
          echo "=== Initial Memory Usage ===" > metrics/system/initial_memory.txt
          free -m >> metrics/system/initial_memory.txt
          
          echo "=== Initial Disk Usage ===" > metrics/system/initial_disk.txt
          df -h >> metrics/system/initial_disk.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Build with Maven and measure performance
        id: build
        timeout-minutes: 15
        env:
          MAVEN_OPTS: "-Xmx2048m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
        run: |
          set -eo pipefail
          
          start_time=$(date +%s%N)
          
          # Collect pre-build metrics
          free -m > metrics/system/pre_build_memory.txt
          
          # Performance monitoring
          python3 performance_monitor.py \
            "./mvnw -B verify -Dmaven.test.skip=true -Dcheckstyle.skip=true -T 1C" \
            metrics/performance/build_performance.csv
          
          build_status=$?
          end_time=$(date +%s%N)
          
          # Collect post-build metrics
          free -m > metrics/system/post_build_memory.txt
          
          # Record build time
          echo "$((($end_time - $start_time)/1000000))" > metrics/performance/build_time.txt
          
          exit $build_status

      - name: Run tests with performance monitoring
        id: test
        if: success()
        timeout-minutes: 20
        run: |
          set -eo pipefail
          
          start_time=$(date +%s%N)
          
          # Collect pre-test metrics
          free -m > metrics/system/pre_test_memory.txt
          
          # Performance monitoring
          python3 performance_monitor.py \
            "./mvnw test -T 1C" \
            metrics/performance/test_performance.csv
          
          test_status=$?
          end_time=$(date +%s%N)
          
          # Collect post-test metrics
          free -m > metrics/system/post_test_memory.txt
          
          # Record test time
          echo "$((($end_time - $start_time)/1000000))" > metrics/performance/test_time.txt
          
          exit $test_status

      - name: Build Docker image with performance monitoring
        id: docker-build
        if: success()
        timeout-minutes: 10
        run: |
          set -eo pipefail
          
          start_time=$(date +%s%N)
          
          # Collect pre-docker metrics
          free -m > metrics/system/pre_docker_memory.txt
          df -h > metrics/system/pre_docker_disk.txt
          
          # Performance monitoring
          python3 performance_monitor.py \
            "docker build -t app:latest -f .devcontainer/Dockerfile . --no-cache" \
            metrics/performance/docker_performance.csv
          
          build_status=$?
          end_time=$(date +%s%N)
          
          # Collect post-docker metrics
          free -m > metrics/system/post_docker_memory.txt
          df -h > metrics/system/post_docker_disk.txt
          
          # Record Docker build time
          echo "$((($end_time - $start_time)/1000000))" > metrics/performance/docker_time.txt
          
          # Collect image size
          docker images app:latest --format "{{.Size}}" > metrics/performance/docker_image_size.txt
          
          exit $build_status

      - name: Collect final system metrics
        if: always()
        run: |
          set -eo pipefail

          # Collect final system metrics
          echo "=== Final System Resources ===" > metrics/system/final_metrics.txt
          top -b -n 1 >> metrics/system/final_metrics.txt || echo "Failed to collect top metrics"

          echo "=== Final Memory Usage ===" > metrics/system/final_memory.txt
          free -m >> metrics/system/final_memory.txt || echo "Failed to collect memory metrics"

          echo "=== Final Disk Usage ===" > metrics/system/final_disk.txt
          df -h >> metrics/system/final_disk.txt || echo "Failed to collect disk metrics"

          # Mark pipeline end time
          date +%s%N > metrics/pipeline_end_time.txt

      - name: Save metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: metrics/
          retention-days: 90
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          docker system prune -af
