name: Green IT Optimized Java Pipeline

on:
  push:
    branches: [ pipeline-optimization ]
  pull_request:
    branches: [ pipeline-optimization ]

jobs:
  build-with-green-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090

      pushgateway:
        image: prom/pushgateway:latest
        ports:
          - 9091:9091

      power-usage-exporter:
        image: custom/power-usage-exporter:latest
        ports:
          - 9102:9102

    steps:
      # Existing checkout and cache steps...

      - name: Setup monitoring tools
        id: setup-monitoring
        run: |
          # Configuration existante...
          
          # Installation de powertop pour les métriques de consommation
          sudo apt-get update && sudo apt-get install -y powertop
          
          # Démarrage de la collecte des métriques énergétiques
          sudo powertop --csv=power_metrics.csv --time=60 &
          echo "POWERTOP_PID=$!" >> $GITHUB_ENV

      - name: Maven Build with Energy Metrics
        id: maven
        run: |
          # Métriques de build existantes...
          
          # Collecte des métriques énergétiques pendant le build
          start_power=$(cat /sys/class/power_supply/BAT0/power_now 2>/dev/null || echo "0")
          
          ./mvnw -B verify
          
          end_power=$(cat /sys/class/power_supply/BAT0/power_now 2>/dev/null || echo "0")
          power_consumed=$((end_power - start_power))
          echo "BUILD_POWER_CONSUMPTION=$power_consumed" >> $GITHUB_ENV

      - name: Analyze Container Size
        id: container-analysis
        run: |
          # Analyse de la taille des couches
          docker history --no-trunc --format "{{.Size}}\t{{.CreatedBy}}" app:latest > image_layers.txt
          
          # Calcul de la taille totale
          total_size=$(docker image ls app:latest --format "{{.Size}}")
          echo "CONTAINER_SIZE=$total_size" >> $GITHUB_ENV

      - name: Export Green IT Metrics
        if: always()
        run: |
          export_metric() {
            echo "${1}{stage=\"${3}\",project=\"petclinic\"} ${2}" | \
            curl --data-binary @- http://localhost:9091/metrics/job/green-metrics
          }
          
          # Métriques existantes...
          
          # Nouvelles métriques Green IT
          export_metric "pipeline_power_consumption_watts" "${BUILD_POWER_CONSUMPTION}" "build"
          export_metric "container_size_bytes" "${CONTAINER_SIZE}" "container"
          
          # Métriques de cache
          cache_hit_rate=$(grep -c "from cache" image_layers.txt)
          export_metric "cache_hit_rate" "$cache_hit_rate" "cache"
          
          # Métriques de parallélisation
          parallel_jobs=$(grep -c "parallel" .mvn/maven.config || echo "1")
          export_metric "parallel_jobs_count" "$parallel_jobs" "parallelization"

      - name: Generate Energy Efficiency Report
        run: |
          {
            echo "=== Green IT Metrics Report ===" > green_it_report.txt
            echo "Build Power Consumption: ${BUILD_POWER_CONSUMPTION}W" >> green_it_report.txt
            echo "Container Size: ${CONTAINER_SIZE}" >> green_it_report.txt
            echo "Cache Hit Rate: ${cache_hit_rate}" >> green_it_report.txt
            echo "Parallel Jobs: ${parallel_jobs}" >> green_it_report.txt
          
            echo "=== Power Usage Details ===" >> green_it_report.txt
            cat power_metrics.csv >> green_it_report.txt
          }

      - name: Save Green IT Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-it-metrics
          path: |
            green_it_report.txt
            power_metrics.csv
            image_layers.txt
          retention-days: 90
