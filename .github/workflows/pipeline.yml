name: Enhanced Java Application Pipeline with Energy Monitoring

on:
  push:
    branches: [ pipeline-optimization ]
  pull_request:
    branches: [ pipeline-optimization ]

jobs:
  build-with-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSR module and permissions
        run: |
          sudo apt-get update
          sudo apt-get install -y msr-tools linux-tools-common linux-tools-generic
          sudo modprobe msr || echo "Warning: Could not load MSR module"
          sudo chmod +r /dev/cpu/*/msr || echo "Warning: Could not set MSR permissions"
          echo "MSR setup completed"

      - name: Setup Rust and Scaphandre
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source "$HOME/.cargo/env"
          cargo install scaphandre --version 0.5.0
          sudo cp $HOME/.cargo/bin/scaphandre /usr/local/bin/
          sudo setcap cap_sys_rawio=+ep /usr/local/bin/scaphandre
          sudo RUST_LOG=debug scaphandre json --step 1 || echo "Test run completed"

      - name: Setup directories and install dependencies
        run: |
          mkdir -p metrics/{system,power,performance}
          sudo apt-get install -y python3-pip python3-psutil
          pip3 install pandas numpy

      - name: Create energy monitoring script
        run: |
          cat > energy_monitor.py << 'EOL'
          #!/usr/bin/env python3
          import subprocess
          import csv
          import os
          import sys
          import time
          import json
          import signal
          from datetime import datetime

          def check_msr_permissions():
              try:
                  subprocess.run(['sudo', 'modprobe', 'msr'], check=True)
                  for msr in subprocess.check_output(['find', '/dev/cpu', '-name', 'msr'], universal_newlines=True).splitlines():
                      subprocess.run(['sudo', 'chmod', '644', msr], check=True)
                  return True
              except subprocess.CalledProcessError as e:
                  print(f"MSR configuration error: {e}", file=sys.stderr)
                  return False

          def monitor_energy(command, output_file):
              if not check_msr_permissions():
                  print("MSR permissions issue")
          
              os.makedirs(os.path.dirname(output_file), exist_ok=True)
          
              with open(output_file, 'w', newline='') as csvfile:
                  writer = csv.writer(csvfile)
                  writer.writerow(['Timestamp', 'Power_Watts', 'Component'])
          
              def signal_handler(signum, frame):
                  print("Stopping monitoring...")
                  sys.exit(0)
          
              signal.signal(signal.SIGTERM, signal_handler)
              signal.signal(signal.SIGINT, signal_handler)
          
              main_process = subprocess.Popen(command, shell=True)
              scaphandre_process = None
          
              try:
                  scaphandre_process = subprocess.Popen(
                      ['sudo', 'scaphandre', 'json', '--step', '1'],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      bufsize=1
                  )
          
                  while main_process.poll() is None:
                      output = scaphandre_process.stdout.readline()
                      if output:
                          try:
                              data = json.loads(output.strip())
                              timestamp = data.get('timestamp', datetime.now().isoformat())
                              power = data.get('power', {}).get('total_power', 0)
          
                              with open(output_file, 'a', newline='') as csvfile:
                                  writer = csv.writer(csvfile)
                                  writer.writerow([timestamp, power, 'System'])
                          except json.JSONDecodeError:
                              continue
          
                      error = scaphandre_process.stderr.readline()
                      if error:
                          print(f"Scaphandre error: {error.strip()}", file=sys.stderr)
          
                  return main_process.returncode
          
              finally:
                  if scaphandre_process and scaphandre_process.poll() is None:
                      scaphandre_process.terminate()
                  if main_process.poll() is None:
                      main_process.terminate()

          if __name__ == '__main__':
              if len(sys.argv) < 3:
                  print("Usage: python energy_monitor.py 'command' output_file.csv")
                  sys.exit(1)
              monitor_energy(sys.argv[1], sys.argv[2])
          EOL
          chmod +x energy_monitor.py

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Collect initial metrics
        run: |
          date +%s%N > metrics/pipeline_start_time.txt
          top -b -n 1 > metrics/system/initial_metrics.txt
          free -m > metrics/system/initial_memory.txt
          df -h > metrics/system/initial_disk.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven and monitor
        id: build
        timeout-minutes: 15
        env:
          MAVEN_OPTS: "-Xmx2048m -XX:+TieredCompilation"
        run: |
          start_time=$(date +%s%N)
          free -m > metrics/system/pre_build_memory.txt
          
          sudo python3 energy_monitor.py \
            "./mvnw -B verify -Dmaven.test.skip=true -Dcheckstyle.skip=true -T 1C" \
            metrics/power/build_power_metrics.csv
          
          end_time=$(date +%s%N)
          echo "$((($end_time - $start_time)/1000000))" > metrics/performance/build_time.txt
          free -m > metrics/system/post_build_memory.txt

      - name: Run tests with monitoring
        id: test
        if: success()
        timeout-minutes: 20
        run: |
          start_time=$(date +%s%N)
          free -m > metrics/system/pre_test_memory.txt
          
          sudo python3 energy_monitor.py \
            "./mvnw test -T 1C" \
            metrics/power/test_power_metrics.csv
          
          end_time=$(date +%s%N)
          echo "$((($end_time - $start_time)/1000000))" > metrics/performance/test_time.txt
          free -m > metrics/system/post_test_memory.txt

      - name: Build Docker image with monitoring
        id: docker-build
        if: success()
        timeout-minutes: 10
        run: |
          start_time=$(date +%s%N)
          free -m > metrics/system/pre_docker_memory.txt
          df -h > metrics/system/pre_docker_disk.txt
          
          sudo python3 energy_monitor.py \
            "docker build -t app:latest -f .devcontainer/Dockerfile . --no-cache" \
            metrics/power/docker_build_power_metrics.csv
          
          end_time=$(date +%s%N)
          echo "$((($end_time - $start_time)/1000000))" > metrics/performance/docker_time.txt
          docker images app:latest --format "{{.Size}}" > metrics/performance/docker_image_size.txt
          free -m > metrics/system/post_docker_memory.txt
          df -h > metrics/system/post_docker_disk.txt

      - name: Collect final metrics
        if: always()
        run: |
          top -b -n 1 > metrics/system/final_metrics.txt
          free -m > metrics/system/final_memory.txt
          df -h > metrics/system/final_disk.txt
          date +%s%N > metrics/pipeline_end_time.txt

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: metrics/
          retention-days: 90

      - name: Cleanup
        if: always()
        run: |
          docker system prune -af
          sudo rm -rf metrics/
