name: Enhanced Java Application Pipeline with Metrics

on:
  push:
    branches: [ pipeline-nooptimization ]
  pull_request:
    branches: [ pipeline-nooptimization ]

jobs:
  build-with-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget -q -O- http://localhost:9090/-/healthy || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      pushgateway:
        image: prom/pushgateway:latest
        ports:
          - 9091:9091
        options: >-
          --health-cmd "wget -q -O- http://localhost:9091/-/healthy || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - uses: actions/checkout@v4

      - name: Install Energy Estimation Tools
        run: |
          # Installation de Cloud Carbon Footprint
          npm install @cloud-carbon-footprint/core
          npm install @cloud-carbon-footprint/app
          
          # Installation de scaphandre si disponible
          if command -v docker &> /dev/null; then
            docker pull hubblo/scaphandre:latest
            docker run -d --privileged --name scaphandre hubblo/scaphandre:latest
          fi

      - name: Setup monitoring tools
        id: setup-monitoring
        timeout-minutes: 5
        run: |
          set -eo pipefail
          
          echo "::group::Installing system packages"
          sudo apt-get update || (echo "Failed to update package lists" && exit 1)
          sudo apt-get install -y powerstat linux-tools-common linux-tools-generic || (echo "Failed to install powerstat and linux tools" && exit 1)
          echo "::endgroup::"
          
          echo "::group::Setting up node exporter"
          curl -L --retry 3 https://github.com/prometheus/node_exporter/releases/download/v1.3.1/node_exporter-1.3.1.linux-amd64.tar.gz -o node_exporter.tar.gz || (echo "Failed to download node exporter" && exit 1)
          tar xvfz node_exporter.tar.gz || (echo "Failed to extract node exporter" && exit 1)
          echo "::endgroup::"
          
          # Création des répertoires pour les métriques
          mkdir -p metrics/resources metrics/energy metrics/docker
          
          # Démarrage du monitoring détaillé
          (
            while true; do
              mpstat 1 1 | tail -n 1 >> metrics/resources/cpu_detailed.txt
              sleep 5
            done
          ) &
          echo "MPSTAT_PID=$!" >> $GITHUB_ENV
          
          (
            while true; do
              free -m >> metrics/resources/memory_detailed.txt
              sleep 5
            done
          ) &
          echo "FREE_PID=$!" >> $GITHUB_ENV
          
          ./node_exporter-*/node_exporter --web.listen-address=":9100" &
          echo "NODE_EXPORTER_PID=$!" >> $GITHUB_ENV
          
          timeout 30s bash -c 'until curl -s http://localhost:9100/metrics > /dev/null; do sleep 1; done' || (echo "Node exporter failed to start" && exit 1)
          
          date +%s%N > pipeline_start_time.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Build with Maven
        id: build
        timeout-minutes: 15
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
        run: |
          set -eo pipefail
          
          echo "Creating checkstyle suppressions file..."
          cat > checkstyle-suppressions.xml << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE suppressions PUBLIC
            "-//Checkstyle//DTD SuppressionFilter Configuration 1.2//EN"
            "https://checkstyle.org/dtds/suppressions_1_2.dtd">
          <suppressions>
            <suppress files="node_exporter.*" checks="NoHttp"/>
          </suppressions>
          EOF
          
          echo "Modifying checkstyle configuration..."
          if [ -f "src/checkstyle/nohttp-checkstyle.xml" ]; then
            sed -i '/<module name="Checker">/a \    <module name="SuppressionFilter">\n      <property name="file" value="${config_loc}/checkstyle-suppressions.xml"/>\n    </module>' src/checkstyle/nohttp-checkstyle.xml
          fi
          
          echo "Starting Maven build..."
          start_time=$(date +%s%N)
          
          ./mvnw -B verify \
            -Dcheckstyle.config.location=src/checkstyle/nohttp-checkstyle.xml \
            -Dcheckstyle.suppressions.location=checkstyle-suppressions.xml \
            -Dconfig_loc=.
          
          build_status=$?
          end_time=$(date +%s%N)
          echo "BUILD_TIME=$((($end_time - $start_time)/1000000))" >> $GITHUB_ENV
          
          if [ $build_status -ne 0 ]; then
            echo "::error::Maven build failed with status $build_status"
            exit $build_status
          fi

      - name: Run tests
        id: test
        if: success() || failure()
        timeout-minutes: 20
        run: |
          set -eo pipefail
          start_time=$(date +%s%N)
          ./mvnw test
          test_status=$?
          end_time=$(date +%s%N)
          echo "TEST_TIME=$((($end_time - $start_time)/1000000))" >> $GITHUB_ENV
          exit $test_status

      - name: Build Docker image
        id: docker-build
        if: success()
        timeout-minutes: 10
        run: |
          set -eo pipefail
          start_time=$(date +%s%N)
          
          # Build de l'image Docker
          docker build -t app:latest -f .devcontainer/Dockerfile . --no-cache
          build_status=$?
          
          # Collecter les métriques de l'image
          echo "=== Image Docker Metrics ===" > metrics/docker/metrics.txt
          
          # Taille de l'image
          docker images app:latest --format "{{.Size}}" >> metrics/docker/metrics.txt
          IMAGE_SIZE=$(docker images app:latest --format "{{.Size}}" | sed 's/GB/*1024/;s/MB/*1/;s/kB/\/1024/' | bc)
          echo "IMAGE_SIZE_MB=${IMAGE_SIZE}" >> $GITHUB_ENV
          
          # Nombres de layers
          echo "Layers count:" >> metrics/docker/metrics.txt
          docker history app:latest --format "{{.Size}}" | wc -l >> metrics/docker/metrics.txt
          LAYERS_COUNT=$(docker history app:latest --format "{{.Size}}" | wc -l)
          echo "LAYERS_COUNT=${LAYERS_COUNT}" >> $GITHUB_ENV
          
          # Détails des layers
          echo -e "\nLayers details:" >> metrics/docker/metrics.txt
          docker history app:latest --format "table {{.Size}}\t{{.CreatedBy}}" >> metrics/docker/metrics.txt
          
          # Vulnérabilités (si trivy est disponible)
          if command -v trivy &> /dev/null; then
            echo -e "\nVulnerability scan:" >> metrics/docker/metrics.txt
            trivy image app:latest >> metrics/docker/metrics.txt
          fi
          
          # Information sur les ports exposés et volumes
          echo -e "\nImage config:" >> metrics/docker/metrics.txt
          docker inspect app:latest >> metrics/docker/metrics.txt
          
          end_time=$(date +%s%N)
          echo "DOCKER_BUILD_TIME=$((($end_time - $start_time)/1000000))" >> $GITHUB_ENV
          
          # Export des métriques Docker vers Prometheus
          echo "docker_image_size_mb{image=\"app\",tag=\"latest\"} ${IMAGE_SIZE}" | curl --data-binary @- http://localhost:9091/metrics/job/docker-metrics
          echo "docker_image_layers_count{image=\"app\",tag=\"latest\"} ${LAYERS_COUNT}" | curl --data-binary @- http://localhost:9091/metrics/job/docker-metrics
          
          exit $build_status

      - name: Setup Kubernetes
        id: k8s-setup
        if: success()
        uses: helm/kind-action@v1
        with:
          wait: 120s

      - name: Deploy to Kubernetes
        id: deploy
        if: success()
        timeout-minutes: 10
        run: |
          set -eo pipefail
          start_time=$(date +%s%N)
          kubectl apply -f k8s/ || (echo "Failed to apply Kubernetes manifests" && exit 1)
          
          if ! kubectl wait --for=condition=ready pod -l app=petclinic --timeout=180s; then
            echo "::error::Deployment failed - collecting debug information"
            kubectl describe pods -l app=petclinic
            kubectl logs -l app=petclinic --all-containers=true
            exit 1
          fi
          
          end_time=$(date +%s%N)
          echo "DEPLOY_TIME=$((($end_time - $start_time)/1000000))" >> $GITHUB_ENV

      - name: Calculate Energy Metrics
        if: always()
        timeout-minutes: 5
        run: |
          set -eo pipefail
          
          # Fonction pour estimer la consommation énergétique
          calculate_energy() {
            local cpu_usage=$1
            local duration_ms=$2
            local memory_mb=$3
          
            # Facteurs de conversion approximatifs
            local CPU_WATTS_PER_PERCENT=2.5
            local MEMORY_WATTS_PER_GB=2.0
          
            # Calcul CPU
            local cpu_energy=$(echo "$cpu_usage * $CPU_WATTS_PER_PERCENT * $duration_ms / 1000" | bc)
          
            # Calcul mémoire
            local memory_gb=$(echo "$memory_mb / 1024" | bc -l)
            local memory_energy=$(echo "$memory_gb * $MEMORY_WATTS_PER_GB * $duration_ms / 1000" | bc)
          
            # Total en watt-secondes
            echo "$cpu_energy + $memory_energy" | bc
          }
          
          # Calcul des moyennes pour le build
          AVG_CPU_BUILD=$(awk '{ sum += $1 } END { print sum/NR }' metrics/resources/cpu_detailed.txt)
          AVG_MEM_BUILD=$(awk '{ sum += $3 } END { print sum/NR }' metrics/resources/memory_detailed.txt)
          
          # Calcul des moyennes pour les tests
          AVG_CPU_TEST=$(awk '{ sum += $1 } END { print sum/NR }' metrics/resources/cpu_detailed.txt)
          AVG_MEM_TEST=$(awk '{ sum += $3 } END { print sum/NR }' metrics/resources/memory_detailed.txt)
          
          # Calcul énergie pour chaque phase
          if [ -n "${BUILD_TIME}" ]; then
            BUILD_ENERGY=$(calculate_energy $AVG_CPU_BUILD $BUILD_TIME $AVG_MEM_BUILD)
            echo "BUILD_ENERGY=${BUILD_ENERGY}" >> $GITHUB_ENV
          fi
          
          if [ -n "${TEST_TIME}" ]; then
            TEST_ENERGY=$(calculate_energy $AVG_CPU_TEST $TEST_TIME $AVG_MEM_TEST)
            echo "TEST_ENERGY=${TEST_ENERGY}" >> $GITHUB_ENV
          fi
          
          # Sauvegarder les moyennes pour le rapport
          echo "AVG_CPU_BUILD=${AVG_CPU_BUILD}" >> $GITHUB_ENV
          echo "AVG_MEM_BUILD=${AVG_MEM_BUILD}" >> $GITHUB_ENV
          echo "AVG_CPU_TEST=${AVG_CPU_TEST}" >> $GITHUB_ENV
          echo "AVG_MEM_TEST=${AVG_MEM_TEST}" >> $GITHUB_ENV
          
          # Total énergie
          TOTAL_ENERGY=$(echo "${BUILD_ENERGY:-0} + ${TEST_ENERGY:-0}" | bc)
          echo "TOTAL_ENERGY=${TOTAL_ENERGY}" >> $GITHUB_ENV
          
          # Estimation CO2
          CO2_FACTOR=0.475 # kg CO2 par kWh
          CO2_ESTIMATE=$(echo "$TOTAL_ENERGY * $CO2_FACTOR / 3600000" | bc -l)
          echo "CO2_ESTIMATE=${CO2_ESTIMATE}" >> $GITHUB_ENV

          # Génération du rapport énergétique détaillé
          {
            echo "=== Energy Consumption Estimates ==="
            echo "Build Energy Usage: ${BUILD_ENERGY:-0} watt-secondes"
            echo "Test Energy Usage: ${TEST_ENERGY:-0} watt-secondes"
            echo "Total Energy Usage: ${TOTAL_ENERGY} watt-secondes"
            echo "Estimated CO2 Emissions: ${CO2_ESTIMATE} kg CO2e"
            echo ""
            echo "=== Resource Usage Details ==="
            echo "Build Duration: ${BUILD_TIME:-0}ms"
            echo "Test Duration: ${TEST_TIME:-0}ms"
            echo "=== Build Phase ==="
            echo "Average CPU Usage: ${AVG_CPU_BUILD}%"
            echo "Average Memory Usage: ${AVG_MEM_BUILD}MB"
            echo "Docker Image Size: ${IMAGE_SIZE_MB}MB"
            echo "Docker Layers Count: ${LAYERS_COUNT}"
            echo ""
            echo "=== Test Phase ==="
            echo "Average CPU Usage: ${AVG_CPU_TEST}%"
            echo "Average Memory Usage: ${AVG_MEM_TEST}MB"
            echo ""
            echo "Note: Ces estimations sont basées sur des moyennes et des facteurs de conversion standard."
          } > metrics/energy/energy_report.txt

      - name: Export metrics to Prometheus
        if: always()
        timeout-minutes: 5
        run: |
          set -eo pipefail
          
          export_metric() {
            local metric_name=$1
            local metric_value=$2
            local stage=$3
          
            if [ -n "$metric_value" ]; then
              echo "${metric_name}{stage=\"${stage}\",project=\"petclinic\"} ${metric_value}" | \
                curl --retry 3 --retry-delay 2 --max-time 10 --silent --show-error \
                  --data-binary @- http://localhost:9091/metrics/job/petclinic-pipeline || \
                echo "::warning::Failed to export ${metric_name} for ${stage}"
            fi
          }
          
          # Export des métriques de durée
          export_metric "pipeline_build_duration_ms" "${BUILD_TIME}" "build"
          export_metric "pipeline_test_duration_ms" "${TEST_TIME}" "test"
          export_metric "pipeline_docker_build_duration_ms" "${DOCKER_BUILD_TIME}" "docker-build"
          export_metric "pipeline_deploy_duration_ms" "${DEPLOY_TIME}" "deploy"
          
          # Export des métriques énergétiques
          export_metric "pipeline_energy_consumption_ws" "${BUILD_ENERGY}" "build"
          export_metric "pipeline_energy_consumption_ws" "${TEST_ENERGY}" "test"
          export_metric "pipeline_total_energy_consumption_ws" "${TOTAL_ENERGY}" "total"
          export_metric "pipeline_co2_emissions_kg" "${CO2_ESTIMATE}" "total"

      - name: Save metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: |
            metrics/energy/energy_report.txt
            metrics/resources/
            metrics/energy/
            metrics/docker/
            system_metrics.txt
            memory_metrics.txt
            disk_metrics.txt
            pipeline_start_time.txt
            pipeline_end_time.txt
          retention-days: 90
          if-no-files-found: warn
