name: Enhanced Java Application Pipeline with Energy Monitoring

on:
  push:
    branches: [ pipeline-optimization ]
  pull_request:
    branches: [ pipeline-optimization ]

jobs:
  build-with-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSR monitoring
        run: |
          sudo apt-get update
          sudo apt-get install -y msr-tools linux-tools-common linux-tools-generic python3-pip
          sudo modprobe msr
          sudo chmod +r /dev/cpu/*/msr
          pip3 install pandas numpy

      - name: Create monitoring directories
        run: |
          mkdir -p metrics/system
          mkdir -p metrics/power
          mkdir -p metrics/performance
          mkdir -p metrics/memory
          mkdir -p metrics/network

      - name: Install RAPL monitor script
        run: |
          cat > rapl_monitor.py << 'EOL'
          # [Le contenu du script RAPL monitor précédent ici]
          EOL
          chmod +x rapl_monitor.py

      - name: Collect initial system state
        run: |
          echo "=== System Information ===" > metrics/system/system_info.txt
          lscpu >> metrics/system/system_info.txt
          cat /proc/cpuinfo >> metrics/system/system_info.txt
          
          echo "=== Initial Memory State ===" > metrics/memory/initial_memory.txt
          free -m >> metrics/memory/initial_memory.txt
          vmstat -s >> metrics/memory/initial_memory.txt
          
          echo "=== Network Interfaces ===" > metrics/network/interfaces.txt
          ip addr >> metrics/network/interfaces.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven and monitor resources
        run: |
          # Démarrage monitoring réseau
          sar -n DEV 1 > metrics/network/build_network.txt &
          SAR_PID=$!
          
          # Démarrage monitoring IO
          iostat 1 > metrics/system/build_io.txt &
          IOSTAT_PID=$!
          
          # Build avec monitoring RAPL
          START_TIME=$(date +%s)
          sudo python3 rapl_monitor.py \
            "./mvnw -B verify -DskipTests" \
            metrics/power/build_power_metrics.csv
          END_TIME=$(date +%s)
          
          # Arrêt monitoring
          kill $SAR_PID $IOSTAT_PID
          
          # Calcul durée
          echo $((END_TIME - START_TIME)) > metrics/performance/build_duration.txt

      - name: Run tests with monitoring
        run: |
          # Démarrage monitoring
          sar -n DEV 1 > metrics/network/test_network.txt &
          SAR_PID=$!
          
          START_TIME=$(date +%s)
          sudo python3 rapl_monitor.py \
            "./mvnw test" \
            metrics/power/test_power_metrics.csv
          END_TIME=$(date +%s)
          
          # Arrêt monitoring
          kill $SAR_PID
          
          # Métriques de test
          echo $((END_TIME - START_TIME)) > metrics/performance/test_duration.txt
          
          # Collecter résultats tests
          find . -name "TEST-*.xml" -exec cp {} metrics/performance/ \;

      - name: Build Docker image with monitoring
        run: |
          START_TIME=$(date +%s)
          
          # Monitoring disque pré-build
          df -h > metrics/system/pre_docker_disk.txt
          
          # Build avec monitoring énergétique
          sudo python3 rapl_monitor.py \
            "docker build -t app:latest ." \
            metrics/power/docker_power_metrics.csv
          
          END_TIME=$(date +%s)
          
          # Métriques post-build
          df -h > metrics/system/post_docker_disk.txt
          docker images app:latest --format "{{.Size}}" > metrics/performance/docker_size.txt
          echo $((END_TIME - START_TIME)) > metrics/performance/docker_duration.txt

      - name: Generate metrics summary
        if: always()
        run: |
          {
            echo "=== Performance Summary ==="
            echo "Build duration: $(cat metrics/performance/build_duration.txt) seconds"
            echo "Test duration: $(cat metrics/performance/test_duration.txt) seconds"
            echo "Docker build duration: $(cat metrics/performance/docker_duration.txt) seconds"
            echo "Docker image size: $(cat metrics/performance/docker_size.txt)"
          
            echo -e "\n=== Resource Usage ==="
            echo "Peak memory usage: $(cat metrics/memory/initial_memory.txt | grep "used" | head -n1)"
          
            echo -e "\n=== Power Consumption ==="
            echo "Build phase average power: $(python3 -c 'import pandas as pd; df=pd.read_csv("metrics/power/build_power_metrics.csv"); print(f"{df.Power_Watts.mean():.2f} Watts")')"
            echo "Test phase average power: $(python3 -c 'import pandas as pd; df=pd.read_csv("metrics/power/test_power_metrics.csv"); print(f"{df.Power_Watts.mean():.2f} Watts")')"
            echo "Docker build average power: $(python3 -c 'import pandas as pd; df=pd.read_csv("metrics/power/docker_power_metrics.csv"); print(f"{df.Power_Watts.mean():.2f} Watts")')"
          } > metrics/summary.txt

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: metrics/
          retention-days: 90

      - name: Cleanup
        if: always()
        run: |
          docker system prune -af
