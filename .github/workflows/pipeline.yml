name: Enhanced Java Application Pipeline with Performance Monitoring

on:
  push:
    branches: [ pipeline-optimization ]
  pull_request:
    branches: [ pipeline-optimization ]

jobs:
  performance-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Performance Monitoring Tools
        run: |
          # Install performance monitoring tools
          sudo apt-get update
          sudo apt-get install -y \
            linux-tools-common \
            python3-pip
          
          pip3 install psutil pandas numpy

      - name: Create performance monitoring script
        run: |
          cat > performance_monitor.py << 'EOL'
          import subprocess
          import csv
          import os
          import sys
          import time
          import psutil
          import signal

          class TimeoutException(Exception):
              pass

          def timeout_handler(signum, frame):
              raise TimeoutException("Command timed out")

          def monitor_performance(command, output_file, timeout=1800):  # 30 minutes default timeout
              os.makedirs(os.path.dirname(output_file), exist_ok=True)
          
              with open(output_file, 'w', newline='') as csvfile:
                  writer = csv.writer(csvfile)
                  writer.writerow([
                      'Timestamp', 
                      'CPU_Usage_%', 
                      'Memory_Usage_MB', 
                      'Memory_Percent', 
                      'Disk_Read_MB', 
                      'Disk_Write_MB'
                  ])
          
                  # Capture initial disk I/O and system state
                  disk_io_start = psutil.disk_io_counters()
          
                  # Setup timeout
                  signal.signal(signal.SIGALRM, timeout_handler)
                  signal.alarm(timeout)
          
                  try:
                      # Run the main command
                      start_time = time.time()
                      process = subprocess.Popen(
                          command, 
                          shell=True, 
                          stdout=subprocess.PIPE, 
                          stderr=subprocess.PIPE,
                          universal_newlines=True
                      )
          
                      # Monitor while process is running
                      while process.poll() is None:
                          current_time = time.time()
          
                          # Get current system metrics
                          cpu_usage = psutil.cpu_percent()
                          memory = psutil.virtual_memory()
                          memory_usage_mb = memory.used / (1024 * 1024)
                          memory_percent = memory.percent
          
                          # Get current disk I/O
                          disk_io_current = psutil.disk_io_counters()
                          disk_read_mb = (disk_io_current.read_bytes - disk_io_start.read_bytes) / (1024 * 1024)
                          disk_write_mb = (disk_io_current.write_bytes - disk_io_start.write_bytes) / (1024 * 1024)
          
                          writer.writerow([
                              time.strftime('%Y-%m-%d %H:%M:%S'),
                              cpu_usage,
                              memory_usage_mb,
                              memory_percent,
                              disk_read_mb,
                              disk_write_mb
                          ])
          
                          time.sleep(1)  # Sampling interval
          
                      # Wait for process to complete
                      stdout, stderr = process.communicate()
          
                      # Return the process status
                      return process.returncode, stdout, stderr
          
                  except TimeoutException:
                      process.terminate()
                      print("Command timed out", file=sys.stderr)
                      return -1, None, None
          
                  finally:
                      # Cancel the alarm
                      signal.alarm(0)

          def main():
              if len(sys.argv) < 3:
                  print("Usage: python performance_monitor.py 'command' output_file.csv")
                  sys.exit(1)

              command = sys.argv[1]
              output_file = sys.argv[2]

              status, stdout, stderr = monitor_performance(command, output_file)
          
              if status != 0:
                  print(f"Command failed with status {status}")
                  if stderr:
                      print("Error output:", stderr)
                  sys.exit(status)

          if __name__ == '__main__':
              main()
          EOL
          
          chmod +x performance_monitor.py

      - name: Create metrics directories
        run: |
          mkdir -p metrics/system
          mkdir -p metrics/performance
          mkdir -p metrics/resource_usage

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Collect initial system metrics
        run: |
          set -eo pipefail
          
          # Record start time
          date +%s%N > metrics/pipeline_start_time.txt
          
          # Collect initial system metrics
          echo "=== Initial System Resources ===" > metrics/system/initial_metrics.txt
          top -b -n 1 >> metrics/system/initial_metrics.txt
          
          echo "=== Initial Memory Usage ===" > metrics/system/initial_memory.txt
          free -m >> metrics/system/initial_memory.txt
          
          echo "=== Initial Disk Usage ===" > metrics/system/initial_disk.txt
          df -h >> metrics/system/initial_disk.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Build with Maven and measure performance
        id: build
        timeout-minutes: 15
        env:
          MAVEN_OPTS: "-Xmx2048m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
        run: |
          set -eo pipefail
          
          start_time=$(date +%s%N)
          
          # Collect pre-build metrics
          free -m > metrics/system/pre_build_memory.txt
          top -b -n 1 > metrics/system/pre_build_resources.txt
          
          # Performance monitoring during Maven build
          python3 performance_monitor.py \
            "./mvnw -B verify -Dmaven.test.skip=true -Dcheckstyle.skip=true -T 1C" \
            metrics/performance/build_performance_metrics.csv
          
          build_status=$?
          end_time=$(date +%s%N)
          
          # Collect post-build metrics
          free -m > metrics/system/post_build_memory.txt
          top -b -n 1 > metrics/system/post_build_resources.txt
          
          # Record build time
          echo "$((($end_time - $start_time)/1000000))" > metrics/performance/build_time.txt
          
          exit $build_status

      - name: Run tests with performance monitoring
        id: test
        if: success()
        timeout-minutes: 20
        run: |
          set -eo pipefail
          
          start_time=$(date +%s%N)
          
          # Collect pre-test metrics
          free -m > metrics/system/pre_test_memory.txt
          top -b -n 1 > metrics/system/pre_test_resources.txt
          
          # Performance monitoring during tests
          python3 performance_monitor.py \
            "./mvnw test -T 1C" \
            metrics/performance/test_performance_metrics.csv
          
          test_status=$?
          end_time=$(date +%s%N)
          
          # Collect post-test metrics
          free -m > metrics/system/post_test_memory.txt
          top -b -n 1 > metrics/system/post_test_resources.txt
          
          # Record test execution time
          echo "$((($end_time - $start_time)/1000000))" > metrics/performance/test_time.txt
          
          exit $test_status

      - name: Build Docker image with performance monitoring
        id: docker-build
        if: success()
        timeout-minutes: 10
        run: |
          set -eo pipefail
          
          start_time=$(date +%s%N)
          
          # Collect pre-Docker build metrics
          free -m > metrics/system/pre_docker_memory.txt
          df -h > metrics/system/pre_docker_disk.txt
          top -b -n 1 > metrics/system/pre_docker_resources.txt
          
          # Performance monitoring during Docker build
          python3 performance_monitor.py \
            "docker build -t app:latest -f .devcontainer/Dockerfile . --no-cache" \
            metrics/performance/docker_build_performance_metrics.csv
          
          build_status=$?
          end_time=$(date +%s%N)
          
          # Collect post-Docker build metrics
          free -m > metrics/system/post_docker_memory.txt
          df -h > metrics/system/post_docker_disk.txt
          top -b -n 1 > metrics/system/post_docker_resources.txt
          
          # Record Docker build time
          echo "$((($end_time - $start_time)/1000000))" > metrics/performance/docker_time.txt
          
          # Collect Docker image size
          docker images app:latest --format "{{.Size}}" > metrics/performance/docker_image_size.txt
          
          exit $build_status

      - name: Collect final system metrics
        if: always()
        run: |
          set -eo pipefail

          # Collect final system metrics
          echo "=== Final System Resources ===" > metrics/system/final_metrics.txt
          top -b -n 1 >> metrics/system/final_metrics.txt || echo "Failed to collect top metrics"

          echo "=== Final Memory Usage ===" > metrics/system/final_memory.txt
          free -m >> metrics/system/final_memory.txt || echo "Failed to collect memory metrics"

          echo "=== Final Disk Usage ===" > metrics/system/final_disk.txt
          df -h >> metrics/system/final_disk.txt || echo "Failed to collect disk metrics"

          # Mark pipeline end time
          date +%s%N > metrics/pipeline_end_time.txt

      - name: Save metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: metrics/
          retention-days: 90
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          docker system prune -af
