name: Optimized Java Pipeline with Energy Metrics

on:
  push:
    branches: [ pipeline-optimization ]
  pull_request:
    branches: [ pipeline-optimization ]

jobs:
  build-with-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget -q -O- http://localhost:9090/-/healthy || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      pushgateway:
        image: prom/pushgateway:latest
        ports:
          - 9091:9091

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Energy Estimation Tools
        run: |
          # Installation de Cloud Carbon Footprint
          npm install @cloud-carbon-footprint/core
          npm install @cloud-carbon-footprint/app
          
          # Installation de scaphandre si disponible
          if command -v docker &> /dev/null; then
            docker pull hubblo/scaphandre:latest
            docker run -d --privileged --name scaphandre hubblo/scaphandre:latest
          fi

      - name: Cache Node Exporter
        uses: actions/cache@v3
        with:
          path: node_exporter.tar.gz
          key: node-exporter-1.3.1

      - name: Create checkstyle config
        run: |
          cat > checkstyle-suppressions.xml << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE suppressions PUBLIC
            "-//Checkstyle//DTD SuppressionFilter Configuration 1.2//EN"
            "https://checkstyle.org/dtds/suppressions_1_2.dtd">
          <suppressions>
            <suppress files="node_exporter.*" checks="NoHttp"/>
          </suppressions>
          EOF

          if [ -f "src/checkstyle/nohttp-checkstyle.xml" ]; then
            sed -i '/<module name="Checker">/a \    <module name="SuppressionFilter">\n      <property name="file" value="${config_loc}/checkstyle-suppressions.xml"/>\n    </module>' src/checkstyle/nohttp-checkstyle.xml
          fi

      - name: Setup monitoring tools
        id: setup-monitoring
        timeout-minutes: 3
        run: |
          set -eo pipefail
          if [ ! -f node_exporter.tar.gz ]; then
            curl -L --retry 3 https://github.com/prometheus/node_exporter/releases/download/v1.3.1/node_exporter-1.3.1.linux-amd64.tar.gz -o node_exporter.tar.gz
          fi
          tar xf node_exporter.tar.gz
          ./node_exporter-*/node_exporter --web.listen-address=":9100" &
          echo "NODE_EXPORTER_PID=$!" >> $GITHUB_ENV
          
          # Création des répertoires pour les métriques
          mkdir -p metrics/resources metrics/docker
          
          # Démarrage du monitoring détaillé
          (
            while true; do
              mpstat 1 1 | tail -n 1 >> metrics/resources/cpu_detailed.txt
              sleep 5
            done
          ) &
          echo "MPSTAT_PID=$!" >> $GITHUB_ENV
          
          (
            while true; do
              free -m >> metrics/resources/memory_detailed.txt
              sleep 5
            done
          ) &
          echo "FREE_PID=$!" >> $GITHUB_ENV
          
          date +%s%N > pipeline_start_time.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'

      - name: Maven Build and Test
        id: maven
        timeout-minutes: 25
        env:
          MAVEN_OPTS: "-Xmx2g -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
        run: |
          set -eo pipefail
          
          # Capture du début
          BUILD_START=$(date +%s%N)
          
          # Build
          ./mvnw -B verify -DskipTests \
            -Dcheckstyle.config.location=src/checkstyle/nohttp-checkstyle.xml \
            -Dcheckstyle.suppressions.location=checkstyle-suppressions.xml \
            -Dconfig_loc=.
          
          # Capture de la fin du build
          BUILD_END=$(date +%s%N)
          BUILD_DURATION=$((($BUILD_END - $BUILD_START)/1000000))
          echo "BUILD_DURATION=${BUILD_DURATION}" >> $GITHUB_ENV
          
          # Tests
          TEST_START=$(date +%s%N)
          ./mvnw -B test
          TEST_END=$(date +%s%N)
          TEST_DURATION=$((($TEST_END - $TEST_START)/1000000))
          echo "TEST_DURATION=${TEST_DURATION}" >> $GITHUB_ENV

      - name: Build and Analyze Docker Image
        id: docker
        timeout-minutes: 10
        run: |
          set -eo pipefail
          
          # Capture du début
          DOCKER_START=$(date +%s%N)
          
          # Build de l'image
          docker build -t app:latest -f .devcontainer/Dockerfile . --no-cache
          
          # Analyse de l'image
          echo "=== Docker Image Analysis ===" > metrics/docker/metrics.txt
          
          # Taille et layers
          docker images app:latest --format "{{.Size}}" >> metrics/docker/metrics.txt
          IMAGE_SIZE=$(docker images app:latest --format "{{.Size}}" | sed 's/GB/*1024/;s/MB/*1/;s/kB/\/1024/' | bc)
          LAYERS_COUNT=$(docker history app:latest --format "{{.Size}}" | wc -l)
          
          echo "IMAGE_SIZE_MB=${IMAGE_SIZE}" >> $GITHUB_ENV
          echo "LAYERS_COUNT=${LAYERS_COUNT}" >> $GITHUB_ENV
          
          # Détails des layers
          echo -e "\nLayer Details:" >> metrics/docker/metrics.txt
          docker history app:latest --format "table {{.Size}}\t{{.CreatedBy}}" >> metrics/docker/metrics.txt
          
          # Configuration
          echo -e "\nImage Configuration:" >> metrics/docker/metrics.txt
          docker inspect app:latest >> metrics/docker/metrics.txt
          
          # Calcul durée
          DOCKER_END=$(date +%s%N)
          DOCKER_DURATION=$((($DOCKER_END - $DOCKER_START)/1000000))
          echo "DOCKER_DURATION=${DOCKER_DURATION}" >> $GITHUB_ENV
          
          # Export vers Prometheus
          echo "docker_image_size_mb{image=\"app\",tag=\"latest\"} ${IMAGE_SIZE}" | curl --data-binary @- http://localhost:9091/metrics/job/docker_metrics
          echo "docker_image_layers_count{image=\"app\",tag=\"latest\"} ${LAYERS_COUNT}" | curl --data-binary @- http://localhost:9091/metrics/job/docker_metrics
          echo "docker_build_duration_ms{image=\"app\",tag=\"latest\"} ${DOCKER_DURATION}" | curl --data-binary @- http://localhost:9091/metrics/job/docker_metrics

      - name: Calculate Energy Metrics
        run: |
          # Fonction pour estimer la consommation énergétique
          calculate_energy() {
            local cpu_usage=$1
            local duration_ms=$2
            local memory_mb=$3
          
            # Facteurs de conversion approximatifs
            local CPU_WATTS_PER_PERCENT=2.5
            local MEMORY_WATTS_PER_GB=2.0
          
            # Calcul CPU
            local cpu_energy=$(echo "$cpu_usage * $CPU_WATTS_PER_PERCENT * $duration_ms / 1000" | bc)
          
            # Calcul mémoire
            local memory_gb=$(echo "$memory_mb / 1024" | bc -l)
            local memory_energy=$(echo "$memory_gb * $MEMORY_WATTS_PER_GB * $duration_ms / 1000" | bc)
          
            # Total en watt-secondes
            echo "$cpu_energy + $memory_energy" | bc
          }
          
          # Calculs pour chaque phase
          AVG_CPU_BUILD=$(awk '{ sum += $1 } END { print sum/NR }' metrics/resources/cpu_detailed.txt)
          AVG_MEM_BUILD=$(awk '{ sum += $3 } END { print sum/NR }' metrics/resources/memory_detailed.txt)
          BUILD_ENERGY=$(calculate_energy $AVG_CPU_BUILD $BUILD_DURATION $AVG_MEM_BUILD)
          
          AVG_CPU_TEST=$(awk '{ sum += $1 } END { print sum/NR }' metrics/resources/cpu_detailed.txt)
          AVG_MEM_TEST=$(awk '{ sum += $3 } END { print sum/NR }' metrics/resources/memory_detailed.txt)
          TEST_ENERGY=$(calculate_energy $AVG_CPU_TEST $TEST_DURATION $AVG_MEM_TEST)
          
          AVG_CPU_DOCKER=$(awk '{ sum += $1 } END { print sum/NR }' metrics/resources/cpu_detailed.txt)
          AVG_MEM_DOCKER=$(awk '{ sum += $3 } END { print sum/NR }' metrics/resources/memory_detailed.txt)
          DOCKER_ENERGY=$(calculate_energy $AVG_CPU_DOCKER $DOCKER_DURATION $AVG_MEM_DOCKER)
          
          # Total
          TOTAL_ENERGY=$(echo "$BUILD_ENERGY + $TEST_ENERGY + $DOCKER_ENERGY" | bc)
          echo "TOTAL_ENERGY=${TOTAL_ENERGY}" >> $GITHUB_ENV
          
          # Estimation CO2
          CO2_FACTOR=0.475 # kg CO2 par kWh
          CO2_ESTIMATE=$(echo "$TOTAL_ENERGY * $CO2_FACTOR / 3600000" | bc -l)
          echo "CO2_ESTIMATE=${CO2_ESTIMATE}" >> $GITHUB_ENV

      - name: Export Energy Metrics
        run: |
          export_metric() {
            echo "${1}{stage=\"${3}\",project=\"petclinic\"} ${2}" | \
            curl --retry 3 -s --data-binary @- http://localhost:9091/metrics/job/pipeline_energy
          }
          
          export_metric "pipeline_energy_consumption_ws" "${BUILD_ENERGY}" "build"
          export_metric "pipeline_energy_consumption_ws" "${TEST_ENERGY}" "test"
          export_metric "pipeline_energy_consumption_ws" "${DOCKER_ENERGY}" "docker"
          export_metric "pipeline_co2_emissions_kg" "${CO2_ESTIMATE}" "total"
          
          # Génération du rapport
          {
            echo "=== Energy Consumption Report ==="
            echo "Build Energy Usage: ${BUILD_ENERGY} watt-secondes"
            echo "Test Energy Usage: ${TEST_ENERGY} watt-secondes"
            echo "Docker Build Energy Usage: ${DOCKER_ENERGY} watt-secondes"
            echo "Total Energy Usage: ${TOTAL_ENERGY} watt-secondes"
            echo "Estimated CO2 Emissions: ${CO2_ESTIMATE} kg CO2e"
            echo ""
            echo "=== Performance Metrics ==="
            echo "Build Duration: ${BUILD_DURATION}ms"
            echo "Test Duration: ${TEST_DURATION}ms"
            echo "Docker Build Duration: ${DOCKER_DURATION}ms"
            echo ""
            echo "=== Docker Metrics ==="
            echo "Image Size: ${IMAGE_SIZE_MB}MB"
            echo "Layer Count: ${LAYERS_COUNT}"
            echo ""
            echo "Note: Ces estimations sont basées sur des facteurs de conversion standard."
          } > metrics/energy_report.txt

      - name: Collect Final Metrics
        if: always()
        timeout-minutes: 5
        run: |
          # Arrêt du monitoring
          if [ -n "$MPSTAT_PID" ]; then
            kill $MPSTAT_PID || echo "::warning::Failed to stop mpstat"
          fi
          if [ -n "$FREE_PID" ]; then
            kill $FREE_PID || echo "::warning::Failed to stop free"
          fi
          if [ -n "$NODE_EXPORTER_PID" ]; then
            kill $NODE_EXPORTER_PID || echo "::warning::Failed to stop node exporter"
          fi

      - name: Upload Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-energy-metrics
          path: |
            metrics/energy_report.txt
            metrics/resources/
            metrics/docker/
            system_metrics.txt
            memory_metrics.txt
            disk_metrics.txt
          retention-days: 90
          if-no-files-found: warn
