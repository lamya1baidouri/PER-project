name: Green IT Metrics with Energy Estimation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  collect-metrics:
    runs-on: ubuntu-latest

    steps:
      # Étapes précédentes...

      - name: Install Energy Estimation Tools
        run: |
          # Installation de Cloud Carbon Footprint
          npm install @cloud-carbon-footprint/core
          npm install @cloud-carbon-footprint/app
          
          # Installation de scaphandre si disponible
          if command -v docker &> /dev/null; then
            docker pull hubblo/scaphandre:latest
            docker run -d --privileged --name scaphandre hubblo/scaphandre:latest
          fi

      - name: Build with Energy Metrics
        id: build
        run: |
          # Capture du début
          BUILD_START=$(date +%s%N)
          
          # Monitoring des ressources détaillé
          mkdir -p metrics/resources
          
          # Monitoring CPU pendant le build
          (
            while true; do
              mpstat 1 1 | tail -n 1 >> metrics/resources/cpu_detailed.txt
              sleep 5
            done
          ) &
          MPSTAT_PID=$!
          
          # Monitoring mémoire
          (
            while true; do
              free -m >> metrics/resources/memory_detailed.txt
              sleep 5
            done
          ) &
          FREE_PID=$!
          
          # Exécution du build
          mvn -B package
          
          # Arrêt du monitoring
          kill $MPSTAT_PID $FREE_PID
          
          # Capture de la fin
          BUILD_END=$(date +%s%N)
          BUILD_DURATION=$((($BUILD_END - $BUILD_START)/1000000))
          echo "BUILD_DURATION=${BUILD_DURATION}" >> $GITHUB_ENV

      - name: Calculate Energy Estimations
        run: |
          # Fonction pour estimer la consommation énergétique
          calculate_energy() {
            local cpu_usage=$1
            local duration_ms=$2
            local memory_mb=$3
          
            # Facteurs de conversion approximatifs
            # Basés sur des moyennes de consommation de serveurs modernes
            local CPU_WATTS_PER_PERCENT=2.5
            local MEMORY_WATTS_PER_GB=2.0
          
            # Calcul CPU
            local cpu_energy=$(echo "$cpu_usage * $CPU_WATTS_PER_PERCENT * $duration_ms / 1000" | bc)
          
            # Calcul mémoire
            local memory_gb=$(echo "$memory_mb / 1024" | bc -l)
            local memory_energy=$(echo "$memory_gb * $MEMORY_WATTS_PER_GB * $duration_ms / 1000" | bc)
          
            # Total en watt-secondes
            echo "$cpu_energy + $memory_energy" | bc
          }
          
          # Récupération des moyennes
          AVG_CPU=$(awk '{ sum += $1 } END { print sum/NR }' metrics/resources/cpu_detailed.txt)
          AVG_MEM=$(awk '{ sum += $3 } END { print sum/NR }' metrics/resources/memory_detailed.txt)
          
          # Calcul de l'estimation
          ENERGY_ESTIMATE=$(calculate_energy $AVG_CPU $BUILD_DURATION $AVG_MEM)
          echo "ENERGY_ESTIMATE=${ENERGY_ESTIMATE}" >> $GITHUB_ENV
          
          # Estimation de l'empreinte carbone
          # Basé sur la moyenne mondiale d'émissions de CO2 par kWh
          CO2_FACTOR=0.475 # kg CO2 par kWh
          CO2_ESTIMATE=$(echo "$ENERGY_ESTIMATE * $CO2_FACTOR / 3600000" | bc -l)
          echo "CO2_ESTIMATE=${CO2_ESTIMATE}" >> $GITHUB_ENV

      - name: Generate Energy Report
        run: |
          {
            echo "=== Energy Consumption Estimates ==="
            echo "Estimated Energy Usage: ${ENERGY_ESTIMATE} watt-secondes"
            echo "Estimated CO2 Emissions: ${CO2_ESTIMATE} kg CO2e"
            echo ""
            echo "=== Resource Usage Details ==="
            echo "Build Duration: ${BUILD_DURATION}ms"
            echo "Average CPU Usage: ${AVG_CPU}%"
            echo "Average Memory Usage: ${AVG_MEM}MB"
            echo ""
            echo "Note: Ces estimations sont basées sur des moyennes et des facteurs de conversion standard."
          } > metrics/energy_report.txt

      - name: Upload Energy Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-it-energy-metrics
          path: |
            metrics/energy_report.txt
            metrics/resources/
          retention-days: 30
