name: Optimized Java Pipeline with Metrics

on:
  push:
    branches: [ pipeline-optimization ]
  pull_request:
    branches: [ pipeline-optimization ]

jobs:
  build-with-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Reduced from 60

    services:
      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget -q -O- http://localhost:9090/-/healthy || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      pushgateway:
        image: prom/pushgateway:latest
        ports:
          - 9091:9091

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for faster checkout

      - name: Cache Node Exporter
        uses: actions/cache@v3
        with:
          path: node_exporter.tar.gz
          key: node-exporter-1.3.1

      - name: Setup monitoring tools
        id: setup-monitoring
        timeout-minutes: 3
        run: |
          set -eo pipefail
          if [ ! -f node_exporter.tar.gz ]; then
            curl -L --retry 3 https://github.com/prometheus/node_exporter/releases/download/v1.3.1/node_exporter-1.3.1.linux-amd64.tar.gz -o node_exporter.tar.gz
          fi
          tar xf node_exporter.tar.gz
          ./node_exporter-*/node_exporter --web.listen-address=":9100" &
          echo "NODE_EXPORTER_PID=$!" >> $GITHUB_ENV
          date +%s%N > pipeline_start_time.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'

      - name: Maven Build and Test
        id: maven
        timeout-minutes: 25
        env:
          MAVEN_OPTS: "-Xmx2g -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
        run: |
          set -eo pipefail
          
          build_start=$(date +%s%N)
          ./mvnw -B verify -DskipTests
          build_end=$(date +%s%N)
          echo "BUILD_TIME=$((($build_end - $build_start)/1000000))" >> $GITHUB_ENV
          
          test_start=$(date +%s%N)
          ./mvnw -B test
          test_end=$(date +%s%N)
          echo "TEST_TIME=$((($test_end - $test_start)/1000000))" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: docker-build
        timeout-minutes: 8
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: app:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup and Deploy to K8s
        id: deploy
        timeout-minutes: 8
        run: |
          start_time=$(date +%s%N)
          kind create cluster --wait 60s
          kubectl apply -f k8s/
          kubectl wait --for=condition=ready pod -l app=petclinic --timeout=120s
          end_time=$(date +%s%N)
          echo "DEPLOY_TIME=$((($end_time - $start_time)/1000000))" >> $GITHUB_ENV

      - name: Export metrics
        if: always()
        run: |
          export_metric() {
            echo "${1}{stage=\"${3}\",project=\"petclinic\"} ${2}" | \
            curl --retry 3 -s --data-binary @- http://localhost:9091/metrics/job/pipeline
          }
          
          export_metric "pipeline_build_duration_ms" "${BUILD_TIME}" "build"
          export_metric "pipeline_test_duration_ms" "${TEST_TIME}" "test"
          export_metric "pipeline_deploy_duration_ms" "${DEPLOY_TIME}" "deploy"
          
          mem_usage=$(free -b | grep Mem: | awk '{print $3}')
          cpu_usage=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}')
          
          export_metric "pipeline_memory_usage_bytes" "$mem_usage" "memory"
          export_metric "pipeline_cpu_usage_percent" "$cpu_usage" "cpu"

      - name: Collect final metrics
        if: always()
        timeout-minutes: 5
        run: |
          set -eo pipefail
          
          date +%s%N > pipeline_end_time.txt
          
          if [ -n "$NODE_EXPORTER_PID" ]; then
            kill $NODE_EXPORTER_PID || echo "::warning::Failed to stop node exporter"
          fi
          
          {
            echo "=== System Resources ===" > system_metrics.txt
            top -b -n 1 >> system_metrics.txt
          } || echo "::warning::Failed to collect top metrics"
          
          {
            echo "=== Memory Usage ===" > memory_metrics.txt
            free -m >> memory_metrics.txt
          } || echo "::warning::Failed to collect memory metrics"
          
          {
            echo "=== Disk Usage ===" > disk_metrics.txt
            df -h >> disk_metrics.txt
          } || echo "::warning::Failed to collect disk metrics"

      - name: Save metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: |
            system_metrics.txt
            memory_metrics.txt
            disk_metrics.txt
            pipeline_start_time.txt
            pipeline_end_time.txt
          retention-days: 90
          if-no-files-found: warn
