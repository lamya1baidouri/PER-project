name: Enhanced Java Application Pipeline with Energy Monitoring

on:
  push:
    branches: [ pipeline-optimization ]
  pull_request:
    branches: [ pipeline-optimization ]

jobs:
  build-with-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup directories and install dependencies
        run: |
          set -eo pipefail
          
          # Structure des répertoires
          mkdir -p metrics/system
          mkdir -p metrics/power
          mkdir -p metrics/performance
          
          # Installation des dépendances
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-psutil \
            curl

          # Installation dépendances Python
          pip3 install pandas numpy

      - name: Create energy monitoring script
        run: |
          cat > energy_monitor.py << 'EOL'
#!/usr/bin/env python3
  import os
  import sys
  import time
  import csv
  from datetime import datetime
  import subprocess

def get_vm_size():
    """Obtenir la taille de la VM Azure"""
      try:
        output = subprocess.check_output(['curl', '-H', 'Metadata:true',
        'http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-01-01&format=text'],
        stderr=subprocess.DEVNULL)
        return output.decode().strip()
      except:
        return 'Standard_DS2_v2'  # Taille par défaut GitHub Actions

def get_tdp():
    """Détermine le TDP basé sur la taille VM"""
      vm_sizes = {
      'Standard_DS2_v2': 35,  # 2 vCPUs
      'Standard_DS4_v2': 70,  # 4 vCPUs
      'Standard_DS8_v2': 140  # 8 vCPUs
}
      vm_size = get_vm_size()
      return vm_sizes.get(vm_size, 35)  # 35W par défaut

def get_cpu_usage():
  with open("/proc/stat") as f:
    cpu = f.readline().split()
  total = sum(map(int, cpu[1:]))
  idle = int(cpu[4])
  return total, idle

def monitor_energy(command, output_file):
    """Monitore l'énergie sur GitHub Actions VM"""
      TDP = get_tdp()
      BASE_POWER = TDP * 0.2  # 20% du TDP au repos
      
      os.makedirs(os.path.dirname(output_file), exist_ok=True)

      with open(output_file, 'w', newline='') as csvfile:
        writer = csv.writer(csvfile)
        writer.writerow(['Timestamp', 'Power_Watts', 'Component'])

      process = os.popen(command)
      prev_total, prev_idle = get_cpu_usage()

      while process.close() is None:
        time.sleep(1)
        total, idle = get_cpu_usage()
        delta_total = total - prev_total
        delta_idle = idle - prev_idle

        if delta_total == 0:
          cpu_percent = 0
        else:
          cpu_percent = 100 * (1 - delta_idle/delta_total)

        # Calcul plus précis pour les VMs Azure
        power = BASE_POWER + (TDP - BASE_POWER) * (cpu_percent / 100.0) * 0.85  # Facteur de correction VM

        with open(output_file, 'a', newline='') as csvfile:
          writer = csv.writer(csvfile)
          writer.writerow([
          datetime.now().isoformat(),
          round(power, 2),
          'System'
          ])

        prev_total, prev_idle = total, idle

def main():
  if len(sys.argv) < 3:
    print("Usage: python energy_monitor.py 'command' output_file.csv")
    sys.exit(1)

  command = sys.argv[1]
  output_file = sys.argv[2]

  try:
    monitor_energy(command, output_file)
  except Exception as e:
    print(f"Error: {e}", file=sys.stderr)
        sys.exit(1)

if __name__ == '__main__':
    main()
EOL
          
          chmod +x energy_monitor.py

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Collect initial system metrics
        run: |
          set -eo pipefail
          
          # Enregistrer le temps de début
          date +%s%N > metrics/pipeline_start_time.txt
          
          # Collecter les métriques initiales
          echo "=== Initial System Resources ===" > metrics/system/initial_metrics.txt
                     top -b -n 1 >> metrics/system/initial_metrics.txt
                     
                     echo "=== Initial Memory Usage ===" > metrics/system/initial_memory.txt
                     free -m >> metrics/system/initial_memory.txt
                     
                     echo "=== Initial Disk Usage ===" > metrics/system/initial_disk.txt
                     df -h >> metrics/system/initial_disk.txt
      
      # Collecter les infos sur la VM
                     echo "=== VM Information ===" > metrics/system/vm_info.txt
                     curl -H Metadata:true "http://169.254.169.254/metadata/instance/compute?api-version=2021-01-01" 2>/dev/null >> metrics/system/vm_info.txt

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'
        cache: maven

    - name: Build with Maven and measure energy
      id: build
      timeout-minutes: 15
      env:
        MAVEN_OPTS: "-Xmx2048m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
      run: |
        set -eo pipefail
        
        start_time=$(date +%s%N)
        free -m > metrics/system/pre_build_memory.txt
        
        # Build avec monitoring
        python3 energy_monitor.py \
          "./mvnw -B verify -Dmaven.test.skip=true -Dcheckstyle.skip=true -T 1C" \
          metrics/power/build_power_metrics.csv
        
        build_status=$?
        end_time=$(date +%s%N)
        
        free -m > metrics/system/post_build_memory.txt
        echo "$((($end_time - $start_time)/1000000))" > metrics/performance/build_time.txt
        
        exit $build_status

    - name: Run tests with energy monitoring
      id: test
      if: success()
      timeout-minutes: 20
      run: |
        set -eo pipefail
        
        start_time=$(date +%s%N)
        free -m > metrics/system/pre_test_memory.txt
        
        # Tests avec monitoring
        python3 energy_monitor.py \
          "./mvnw test -T 1C" \
          metrics/power/test_power_metrics.csv
        
        test_status=$?
        end_time=$(date +%s%N)
        
        free -m > metrics/system/post_test_memory.txt
        echo "$((($end_time - $start_time)/1000000))" > metrics/performance/test_time.txt
        
        exit $test_status

    - name: Build Docker image with energy monitoring
      id: docker-build
      if: success()
      timeout-minutes: 10
      run: |
        set -eo pipefail
        
        start_time=$(date +%s%N)
        
        free -m > metrics/system/pre_docker_memory.txt
        df -h > metrics/system/pre_docker_disk.txt
        
        # Build Docker avec monitoring
        python3 energy_monitor.py \
          "docker build -t app:latest -f .devcontainer/Dockerfile . --no-cache" \
          metrics/power/docker_build_power_metrics.csv
        
        build_status=$?
        end_time=$(date +%s%N)
        
        free -m > metrics/system/post_docker_memory.txt
        df -h > metrics/system/post_docker_disk.txt
        
        echo "$((($end_time - $start_time)/1000000))" > metrics/performance/docker_time.txt
        docker images app:latest --format "{{.Size}}" > metrics/performance/docker_image_size.txt
        
        exit $build_status

    - name: Generate energy metrics summary
      if: always()
      run: |
        python3 - << 'EOF'
        import pandas as pd
        import glob
        import os
        
        # Charger tous les fichiers de métriques énergétiques
        power_files = glob.glob('metrics/power/*.csv')
        total_energy = 0
        summary = []
        
        for file in power_files:
            phase = os.path.basename(file).replace('_power_metrics.csv', '')
            try:
                df = pd.read_csv(file)
                avg_power = df['Power_Watts'].mean()
                max_power = df['Power_Watts'].max()
                duration = len(df)  # en secondes
                energy = avg_power * duration / 3600  # en watt-heures
                total_energy += energy
                summary.append(f"{phase}:")
                summary.append(f"  Puissance moyenne: {avg_power:.2f}W")
                summary.append(f"  Puissance max: {max_power:.2f}W")
                summary.append(f"  Durée: {duration}s")
                summary.append(f"  Énergie: {energy:.2f}Wh")
            except Exception as e:
                summary.append(f"{phase}: Erreur - {str(e)}")
        
        summary.append(f"\nTotal pipeline:")
        summary.append(f"  Énergie totale: {total_energy:.2f}Wh")
        
        with open('metrics/power/energy_summary.txt', 'w') as f:
            f.write('\n'.join(summary))
        EOF

    - name: Collect final system metrics
      if: always()
      run: |
        set -eo pipefail
        
        echo "=== Final System Resources ===" > metrics/system/final_metrics.txt
        top -b -n 1 >> metrics/system/final_metrics.txt || echo "Failed to collect top metrics"
        
        echo "=== Final Memory Usage ===" > metrics/system/final_memory.txt
        free -m >> metrics/system/final_memory.txt || echo "Failed to collect memory metrics"
        
        echo "=== Final Disk Usage ===" > metrics/system/final_disk.txt
        df -h >> metrics/system/final_disk.txt || echo "Failed to collect disk metrics"
        
        date +%s%N > metrics/pipeline_end_time.txt

    - name: Save metrics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-metrics
        path: metrics/
        retention-days: 90
        if-no-files-found: warn

    - name: Cleanup
      if: always()
      run: |
        docker system prune -af
